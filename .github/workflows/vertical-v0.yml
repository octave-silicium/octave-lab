name: VERTICAL-001 V0 source replay
on:
  push:
    paths:
      - 'pipeline/vertical_v0.py'
      - 'tests/test_vertical_v0.py'
      - '.github/workflows/vertical-v0.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_vertical_v0.py' -v
      - run: python -m pipeline.vertical_v0
