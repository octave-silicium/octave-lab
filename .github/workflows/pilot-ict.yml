name: OCTAVE LAB | PILOT-001 ICT sector evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pipeline/pilot_ict.py'
      - 'tests/test_pilot_ict.py'
      - '.github/workflows/pilot-ict.yml'
  schedule:
    - cron: '41 9 15 * *'
permissions:
  contents: write
concurrency:
  group: octave-lab-pilot-ict
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run entire test suite
        run: python -m unittest discover -s tests -v
      - name: Fetch, verify and build descriptive study
        run: python pipeline/pilot_ict.py
      - name: Publish only compact attributed research output
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/PILOT-001/pilot_manifest.json research/PILOT-001/rapport.md
          if ! git diff --cached --quiet; then
            git commit -m 'research(PILOT-001): source-specific ICT sector description'
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase -X theirs origin/main || exit 1
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
      - name: Preserve research outputs as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: octave-lab-pilot-001-${{ github.run_id }}
          path: research/PILOT-001/
          if-no-files-found: warn
          retention-days: 30
