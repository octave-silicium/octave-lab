name: OCTAVE LAB | PILOT-001 ICT sector evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pipeline/pilot_ict.py'
      - 'tests/test_pilot_ict.py'
      - '.github/workflows/pilot-ict.yml'
  schedule:
    - cron: '41 9 15 * *'
permissions:
  contents: read
jobs:
  qualification-hold:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse unqualified public collection and release
        run: |
          echo "SEC-001: route pending scoped rights and continuity review."
          echo "No acquisition, artifact upload, or repository write performed."
          exit 1
