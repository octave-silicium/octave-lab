name: G4 financing qualification
on:
  push:
    paths:
      - 'pipeline/economic_sector_financing*.py'
      - 'pipeline/economic_sector_capital.py'
      - 'tests/test_economic_sector_financing.py'
      - '.github/workflows/g4-financing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_economic_sector_financing.py -v
      - run: |
          python -m pipeline.economic_sector_financing_pilot > financing-audit.json
          cat financing-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: g4-financing-audit
          path: financing-audit.json
          retention-days: 30
