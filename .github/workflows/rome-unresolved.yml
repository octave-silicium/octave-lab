name: OCTAVE LAB | ROME unresolved reference diagnosis
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pipeline/rome_unresolved.py'
      - '.github/workflows/rome-unresolved.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Diagnose exact native keys
        run: python -m pipeline.rome_unresolved
