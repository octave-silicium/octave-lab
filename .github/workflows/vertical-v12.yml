name: VERTICAL-001 V1.2 corrected vintage
on:
  push:
    paths:
      - 'pipeline/vertical_v12.py'
      - 'tests/test_vertical_v12.py'
      - '.github/workflows/vertical-v12.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_vertical_v1*.py' -v
      - run: python -m pipeline.vertical_v12
