name: G4 capital changes qualification
on:
  push:
    paths:
      - 'pipeline/acquire_capital_changes.py'
      - 'pipeline/audit_capital_changes.py'
      - '.github/workflows/capital-changes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m pipeline.acquire_capital_changes
      - run: python -m pipeline.acquire_capital_2022
      - name: Replay pinned capital changes
        run: |
          python -m pipeline.audit_capital_changes capital-2022 capital-change > capital-change/audit.json
          python -c 'import json; a=json.load(open("capital-change/audit.json")); print(json.dumps({"summary":a["summary"],"national_rebase":[r for r in a["rebase"] if r["branch"]=="_T"],"national_wealth":[r for r in a["wealth"] if r["sector"]=="S1"],"asset_flows":a["asset_flows"]},indent=2))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capital-change
          path: capital-change/
          retention-days: 30
