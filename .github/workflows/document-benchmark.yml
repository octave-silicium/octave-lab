name: OCTAVE LAB | W001 heterogeneous document evaluation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pipeline/document_benchmark.py'
      - 'pipeline/experiment_cost.py'
      - 'tests/test_document_benchmark.py'
      - 'tests/test_experiment_cost.py'
      - 'research/PILOT-W001/documents*'
      - '.github/workflows/document-benchmark.yml'
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m pipeline.document_benchmark
      - run: python -m pipeline.document_benchmark --exception-aware
