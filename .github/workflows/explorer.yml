name: OCTAVE LAB | G1 explorer vertical slice
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'explorer/**'
      - 'pipeline/explorer.py'
      - 'tests/test_explorer.py'
      - 'tests/browser_explorer.py'
      - '.github/workflows/explorer.yml'
permissions:
  contents: read
jobs:
  explorer:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Repository tests
        run: python -m unittest discover -s tests -v
      - name: Browser test dependencies
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
      - name: Real archive browser journeys
        run: |
          set -o pipefail
          python -m pipeline.explorer > /tmp/octave-explorer.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8765/api/sources >/dev/null; then break; fi
            sleep 1
          done
          python tests/browser_explorer.py | tee explorer_audit.json
          python -c 'import json; d=json.load(open("explorer_audit.json")); assert len(d["viewports"])==4 and all(x["journey_pass"] for x in d["viewports"])'
      - uses: actions/upload-artifact@v4
        with:
          name: explorer-metadata
          path: explorer_audit.json
          if-no-files-found: error
