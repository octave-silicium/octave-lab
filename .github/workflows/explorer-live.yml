name: OCTAVE LAB | G1 live HTTP integration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pipeline/live_explorer_audit.py'
      - '.github/workflows/explorer-live.yml'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate live HTTP routes and mask all series
        run: |
          set -o pipefail
          python -m pipeline.live_explorer_audit | tee explorer_live_audit.json
          python -c 'import json; d=json.load(open("explorer_live_audit.json")); assert d["loaded_live_sources"]==5 and d["values_emitted"] is False'
      - uses: actions/upload-artifact@v4
        with:
          name: explorer-live-metadata
          path: explorer_live_audit.json
          if-no-files-found: error
