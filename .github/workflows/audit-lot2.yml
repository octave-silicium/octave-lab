name: OCTAVE LAB | Lot 2 emploi embauches
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'governance/source_rights.json'
      - 'governance/series_events.json'
      - 'pipeline/data_governance.py'
      - 'tests/test_data_governance.py'
      - 'pipeline/audit_lot2.py'
      - 'pipeline/audit_lot2_sources.json'
      - 'tests/test_audit_lot2.py'
      - '.github/workflows/audit-lot2.yml'
  schedule:
    - cron: '43 8 12 * *'  # 12th of month, UTC. Audit only; not publication.
permissions:
  contents: read
jobs:
  qualification-hold:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse unqualified public collection and release
        run: |
          echo "SEC-001: route pending scoped rights and continuity review."
          echo "No acquisition, artifact upload, or repository write performed."
          exit 1
