name: OCTAVE LAB | W001 synthetic evaluation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pipeline/invoice_benchmark.py'
      - 'tests/test_invoice_benchmark.py'
      - 'research/PILOT-W001/**'
      - '.github/workflows/invoice-benchmark.yml'
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m pipeline.invoice_benchmark
