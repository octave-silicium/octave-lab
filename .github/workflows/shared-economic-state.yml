name: Shared economic state qualification
on:
  push:
    paths:
      - 'pipeline/economic_shared_state*.py'
      - 'tests/test_economic_shared_state.py'
      - 'governance/transversal_enrichment_v1.json'
      - '.github/workflows/shared-economic-state.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_economic_shared_state.py -v
      - run: python -m pipeline.economic_shared_state_pilot > shared-state-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: shared-state-audit
          path: shared-state-audit.json
