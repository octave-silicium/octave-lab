name: G4 v0.7g3 integrated trajectory
on:
  push:
    paths:
      - 'pipeline/economic_integrated_path.py'
      - 'tests/test_economic_integrated_path.py'
      - '.github/workflows/g4-integrated.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_economic_integrated_path.py' -v
      - run: python -m unittest discover -s tests -p 'test_economic_shared*.py' -v
