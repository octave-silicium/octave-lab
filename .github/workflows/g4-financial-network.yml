name: G4 financial network qualification
on:
  push:
    paths:
      - 'pipeline/economic_financial_network*.py'
      - 'pipeline/audit_financial_network.py'
      - 'tests/test_economic_financial_network.py'
      - '.github/workflows/g4-financial-network.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  network:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_economic_financial_network.py -v
      - run: python -m pipeline.economic_financial_network_pilot > network-audit.json
      - run: cat network-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: network-audit
          path: network-audit.json
          retention-days: 30
