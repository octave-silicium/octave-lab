name: G4 TES income qualification
on:
  push:
    paths:
      - 'pipeline/acquire_tes_income.py'
      - 'pipeline/audit_tes_income.py'
      - 'pipeline/economic_sector_structural.py'
      - 'pipeline/audit_tes_structural.py'
      - 'pipeline/economic_sector_capacity.py'
      - 'pipeline/audit_tes_capacity.py'
      - 'pipeline/economic_sector_capacity_dynamics.py'
      - 'pipeline/audit_tes_capacity_dynamics.py'
      - 'pipeline/economic_sector_prices.py'
      - 'pipeline/audit_tes_prices.py'
      - 'pipeline/economic_sector_budget.py'
      - 'pipeline/audit_tes_budget.py'
      - 'tests/test_economic_sector_budget.py'
      - 'tests/test_economic_sector_prices.py'
      - 'tests/test_economic_sector_capacity_dynamics.py'
      - 'tests/test_economic_sector_capacity.py'
      - 'tests/test_economic_sector_structural.py'
      - 'pipeline/economic_income_bridge.py'
      - 'tests/test_economic_income_bridge.py'
      - '.github/workflows/acquire-tes-income.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  income:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5 numpy==2.2.6
      - run: python pipeline/acquire_tes_income.py
      - name: Acquire pinned symmetric reference
        run: python pipeline/acquire_tes_a38.py --output tes-income/symmetric
      - name: Verify income bridge and run empirical audit
        run: |
          python -m unittest discover -s tests -p test_economic_income_bridge.py -v
          python -m pipeline.audit_tes_income tes-income/standard.xlsx tes-income/symmetric/TES_symetrique_A38_2022DEF_fr.xlsx tes-income/eurostat.json > tes-income/audit.json
          cat tes-income/audit.json
      - name: Verify structural requirements and conditional scenarios
        run: |
          python -m unittest discover -s tests -p test_economic_sector_structural.py -v
          python -m pipeline.audit_tes_structural tes-income/standard.xlsx tes-income/symmetric/TES_symetrique_A38_2022DEF_fr.xlsx tes-income/eurostat.json > tes-income/structural-audit.json
          cat tes-income/structural-audit.json
      - name: Verify capacity allocation and independent reference
        run: |
          python -m unittest discover -s tests -p test_economic_sector_capacity.py -v
          python -m pipeline.audit_tes_capacity tes-income/standard.xlsx tes-income/symmetric/TES_symetrique_A38_2022DEF_fr.xlsx tes-income/eurostat.json > tes-income/capacity-audit.json
          cat tes-income/capacity-audit.json
      - name: Verify dynamic capacity and stock paths
        run: |
          python -m unittest discover -s tests -p test_economic_sector_capacity_dynamics.py -v
          python -m pipeline.audit_tes_capacity_dynamics tes-income/standard.xlsx tes-income/symmetric/TES_symetrique_A38_2022DEF_fr.xlsx tes-income/eurostat.json > tes-income/capacity-dynamics-audit.json
          cat tes-income/capacity-dynamics-audit.json
      - name: Verify network prices and conditional demand
        run: |
          python -m unittest discover -s tests -p test_economic_sector_prices.py -v
          python -m pipeline.audit_tes_prices tes-income/standard.xlsx tes-income/symmetric/TES_symetrique_A38_2022DEF_fr.xlsx tes-income/eurostat.json > tes-income/prices-audit.json
          cat tes-income/prices-audit.json
      - name: Verify household budgets and independent reference
        run: |
          python -m unittest discover -s tests -p test_economic_sector_budget.py -v
          python -m pipeline.audit_tes_budget tes-income/standard.xlsx tes-income/symmetric/TES_symetrique_A38_2022DEF_fr.xlsx tes-income/eurostat.json > tes-income/budget-audit.json
          cat tes-income/budget-audit.json
      - name: Preserve raw and profile
        uses: actions/upload-artifact@v4
        with:
          name: insee-eurostat-income-2022
          path: tes-income/
          retention-days: 30
