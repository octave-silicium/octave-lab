name: OCTAVE LAB | Collecte Insee emploi sectoriel
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pipeline/ingest_insee.py'
      - 'pipeline/semantic_audit.py'
      - 'tests/test_ingest_insee.py'
      - '.github/workflows/collect-insee.yml'
  schedule:
    - cron: '54 8 3 * *'  # Month day 3, UTC; source changes when publisher updates
permissions:
  contents: read
jobs:
  qualification-hold:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse unqualified public collection and release
        run: |
          echo "SEC-001: route pending scoped rights and continuity review."
          echo "No acquisition, artifact upload, or repository write performed."
          exit 1
