name: G4 v0.7g2 settlement and financial reconciliation
on:
  push:
    paths:
      - 'pipeline/economic_shared_settlement.py'
      - 'tests/test_economic_shared_settlement.py'
      - 'pipeline/audit_financial_reconciliation.py'
      - '.github/workflows/g4-settlement.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  settlement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_economic_shared*.py' -v
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pipeline.audit_financial_reconciliation
      - uses: actions/upload-artifact@v4
        with:
          name: financial-reconciliation
          path: financial-reconcile/
