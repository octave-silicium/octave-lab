name: Collecte Indeed France (public originals candidate)
on:
  push:
    branches: [main]
    paths:
      - 'pipeline/run.py'
      - 'pipeline/sources.json'
      - 'tests/test_pipeline.py'
      - 'tools/indeed_public_bundle.py'
      - 'tests/test_indeed_public_bundle.py'
      - '.github/workflows/collect-public-sector.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 2'
concurrency:
  group: octave-indeed-fr-ingestion
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  ingestion:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Tests de controle qualite
        run: python -m unittest discover -s tests -v
      - name: Verify exact allowed public source scope
        run: python -m tools.indeed_public_bundle --preflight
      - name: Recuperer et verifier les series Indeed
        run: python pipeline/run.py --only-open
      - name: Build exact attributed originals candidate
        run: python -m tools.indeed_public_bundle --output indeed-public-candidate
      - name: Preserve allowlisted originals only
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: indeed-originals-candidate-${{ github.run_id }}
          path: indeed-public-candidate/
          if-no-files-found: error
          retention-days: 30
