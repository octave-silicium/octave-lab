name: OCTAVE LAB | Qualification semantique lot 3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pipeline/semantic_audit.py'
      - 'tests/test_semantic_audit.py'
      - '.github/workflows/audit-semantics.yml'
  schedule:
    - cron: '41 8 19 * *'  # Every 19th day of the month, UTC
permissions:
  contents: read
jobs:
  qualification-hold:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse unqualified public collection and release
        run: |
          echo "SEC-001: route pending scoped rights and continuity review."
          echo "No acquisition, artifact upload, or repository write performed."
          exit 1
