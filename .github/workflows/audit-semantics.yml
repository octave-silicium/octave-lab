name: OCTAVE LAB | Qualification semantique lot 3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pipeline/semantic_audit.py'
      - 'tests/test_semantic_audit.py'
      - '.github/workflows/audit-semantics.yml'
  schedule:
    - cron: '41 8 19 * *'  # Every 19th day of the month, UTC
permissions:
  contents: write
concurrency:
  group: octave-lab-semantic-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run all stdlib tests and governance gates
        run: python -m unittest discover -s tests -v
      - name: Inspect Insee headers and vintage anomalies, discover only official MMO links
        run: python pipeline/semantic_audit.py
      - name: Store hashes, source metadata and unresolved gates (no source raw data)
        if: always()
        shell: bash
        run: |
          if [ -s audits/latest_lot3.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add audits/latest_lot3.json
            git diff --cached --quiet || (git commit -m 'audit(lot3): semantic source metadata and DPAE vintage fingerprints' && git push)
          fi
      - name: Preserve audit report for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: octave-semantic-audit-${{ github.run_id }}
          path: audits/latest_lot3.json
          retention-days: 30
          if-no-files-found: warn
