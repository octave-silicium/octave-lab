name: VERTICAL-001 V2a investigation and scenarios
on:
  push:
    paths:
      - 'pipeline/vertical_v2.py'
      - 'pipeline/vertical_scenarios.py'
      - 'tests/test_vertical_v2.py'
      - '.github/workflows/vertical-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  investigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_vertical_v*.py' -v
      - run: python -m pipeline.vertical_v2
