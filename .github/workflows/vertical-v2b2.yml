name: VERTICAL-001 V2b2 integrated dossier
on:
  push:
    paths:
      - 'pipeline/vertical_v2b2.py'
      - 'tests/test_vertical_v2b2.py'
      - '.github/workflows/vertical-v2b2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_vertical_v*.py' -v
      - run: python -m pipeline.vertical_v2b2
