name: G4 financial counterparts qualification
on:
  push:
    paths:
      - 'pipeline/economic_financial_counterparts.py'
      - 'pipeline/acquire_financial_2022.py'
      - 'pipeline/audit_financial_2022.py'
      - 'tests/test_economic_financial_counterparts.py'
      - '.github/workflows/g4-financial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_economic_financial_counterparts.py -v
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m pipeline.acquire_financial_2022
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: financial-2022
          path: financial-2022/
          retention-days: 30
