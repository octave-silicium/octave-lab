name: G4 financial counterparts qualification
on:
  push:
    paths:
      - 'pipeline/economic_financial_counterparts.py'
      - 'pipeline/acquire_financial_2022.py'
      - 'pipeline/audit_financial_2022.py'
      - 'tests/test_economic_financial_counterparts.py'
      - '.github/workflows/g4-financial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_economic_financial_counterparts.py -v
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m pipeline.acquire_financial_2022
      - name: Reconcile pinned financial accounts
        run: |
          python -c 'from pathlib import Path; from pipeline import acquire_tes_income as a; a.OUT=Path("financial-2022"); a.get("tee.xlsx","https://www.insee.fr/fr/statistiques/fichier/8988861/TEE_2022_fr.xlsx")'
          python -m pipeline.audit_financial_2022 financial-2022 > financial-2022/audit.json
          python -c 'import json; a=json.load(open("financial-2022/audit.json")); print(json.dumps({"status":a["status"],"observations":a["observations"],"accounts":a["accounts"],"household_equity":a["household_equity"],"identities":len(a["identities"]),"missing_identities":len(a["missing_identities"]),"unresolved":[r for r in a["identities"] if r["status"]=="UNRESOLVED_RESIDUAL"],"comparisons":len(a["comparisons"]),"missing_comparisons":len(a["missing_comparisons"]),"max_cross_difference":max(abs(float(r["difference"])) for r in a["comparisons"])},indent=2))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: financial-2022
          path: financial-2022/
          retention-days: 30
