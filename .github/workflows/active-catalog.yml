name: OCTAVE LAB | Approved vault analytical acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pipeline/active_catalog.py'
      - 'pipeline/active_catalog_audit.py'
      - 'tests/test_active_catalog.py'
      - '.github/workflows/active-catalog.yml'
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regression
        run: python -m unittest discover -s tests -v
      - name: Nine real datasets, approved and restored vault
        run: |
          set -o pipefail
          python -m pipeline.active_catalog_audit | tee active_catalog_audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: active-catalog-metadata
          path: active_catalog_audit.json
