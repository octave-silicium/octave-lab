name: OCTAVE LAB | G3 economic core
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pipeline/economic_*.py'
      - 'tests/test_economic*.py'
      - 'governance/economic_mechanisms_v2.json'
      - 'governance/investigation_result_v1.json'
      - 'governance/multi_order_prospective_v1.json'
      - 'governance/terminology_fr_v1.json'
      - '.github/workflows/economic-core.yml'
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m pipeline.economic_native
      - run: python -m pipeline.economic_bridge_audit
      - run: python -m pipeline.economic_operations_pilot
      - run: python -m pipeline.economic_events_pilot
      - run: python -m pipeline.economic_transform_pilot
      - run: python -m pipeline.economic_physical_pilot
      - run: python -m pipeline.economic_parallel_pilot
      - run: python -m pipeline.economic_firm_pilot
      - run: python -m pipeline.economic_transition_pilot
      - run: python -m pipeline.economic_skills_pilot
      - run: python -m pipeline.economic_ramp_pilot
      - run: python -m pipeline.economic_market_pilot
