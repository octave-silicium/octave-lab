name: OCTAVE LAB | Audit multi-sources
on:
  push:
    branches: [main]
    paths:
      - 'governance/source_rights.json'
      - 'governance/series_events.json'
      - 'pipeline/data_governance.py'
      - 'tests/test_data_governance.py'
      - 'pipeline/audit_multisource.py'
      - 'pipeline/data_governance.py'
      - 'governance/**'
      - 'tests/test_data_governance.py'
      - 'pipeline/archive_dares.py'
      - 'pipeline/audit_multisource_sources.json'
      - 'tests/test_audit_multisource.py'
      - '.github/workflows/audit-multisource.yml'
  workflow_dispatch:
  schedule:
    - cron: '29 8 5 * *'  # Monthly, UTC
permissions:
  contents: read
jobs:
  qualification-hold:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse unqualified public collection and release
        run: |
          echo "SEC-001: route pending scoped rights and continuity review."
          echo "No acquisition, artifact upload, or repository write performed."
          exit 1
