name: G4 TEE institutional qualification
on:
  push:
    paths:
      - 'pipeline/acquire_tee_2022.py'
      - 'pipeline/audit_tee_2022.py'
      - 'tests/test_economic_institutional_accounts.py'
      - '.github/workflows/acquire-tee.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tee:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -m pipeline.acquire_tee_2022
      - uses: actions/upload-artifact@v4
        with:
          name: tee-2022
          path: tee-2022/
          retention-days: 30
