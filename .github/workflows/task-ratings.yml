name: OCTAVE LAB | O*NET task ratings
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pipeline/task_ratings.py'
      - 'tests/test_task_ratings.py'
      - '.github/workflows/task-ratings.yml'
permissions:
  contents: read
jobs:
  ratings:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m pipeline.task_ratings
