name: LIMITATIONS-001 governance audit
on:
  push:
    paths:
      - 'governance/**'
      - 'docs/**'
      - 'research/**'
      - 'pipeline/**'
      - 'README.md'
      - 'tests/test_limitations_audit.py'
      - 'tests/test_engineering_assurance.py'
      - 'tests/test_repository_inventory.py'
      - 'tools/repository_inventory.py'
      - 'tools/limitation_triage.py'
      - 'tests/test_limitation_triage.py'
      - 'tests/test_validate_b2_review.py'
      - 'tools/validate_b2_review.py'
      - 'tools/validate_b3_review.py'
      - 'tools/requirements_matrix.py'
      - 'tools/security_triage.py'
      - 'tools/indeed_public_bundle.py'
      - 'tools/indeed_archive_promotion.py'
      - 'tools/outbound_ci_inventory.py'
      - 'tests/test_outbound_ci_inventory.py'
      - 'tests/test_security_route_holds.py'
      - 'tests/test_indeed_archive_promotion.py'
      - 'tests/test_indeed_public_bundle.py'
      - '.github/workflows/collect-public-sector.yml'
      - 'tests/test_security_triage.py'
      - 'tests/test_requirements_matrix.py'
      - 'tests/test_validate_b3_review.py'
      - '.github/workflows/limitations-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_limitations_audit.py -v
      - run: python -m unittest discover -s tests -p test_engineering_assurance.py -v
      - run: python -m unittest discover -s tests -p test_repository_inventory.py -v
      - name: Inventory pinned audit baseline
        run: python tools/repository_inventory.py --ref 22fba7635ffd8cafe4684c046d6e2dfd6b9ef93f --output repository-inventory.json
      - run: python -m pipeline.limitations_audit --output limitations-audit.json
      - run: python -m unittest discover -s tests -p test_limitation_triage.py -v
      - name: Triage pinned lexical candidates
        run: python -m tools.limitation_triage --ref 29fcb7b63dd7d8e92ded50dee4b3d95ea4d97430 --output limitation-triage.json
      - run: python -m unittest discover -s tests -p test_validate_b2_review.py -v
      - name: Verify first-pass priority review bindings
        run: python -m tools.validate_b2_review --output audit-b2-review.json
      - run: python -m unittest discover -s tests -p test_validate_b3_review.py -v
      - name: Route remaining groups and verify targeted review
        run: python -m tools.validate_b3_review --output audit-b3-review.json
      - run: python -m unittest discover -s tests -p test_requirements_matrix.py -v
      - name: Build canonical requirements projection
        run: python -m tools.requirements_matrix --ref 44391d2e9eeb5546ee9ed3aa999238e96b5bf949 --output requirements-matrix.json
      - run: python -m unittest discover -s tests -p test_security_triage.py -v
      - name: Read-only security triage of pinned public baseline
        run: python -m tools.security_triage --ref eb4098c138a66add3143aef3aa29428fa70047c6 --output security-triage.json
      - run: python -m unittest discover -s tests -p test_indeed_public_bundle.py -v
      - run: python -m unittest discover -s tests -p test_indeed_archive_promotion.py -v
      - run: python -m unittest discover -s tests -p test_outbound_ci_inventory.py -v
      - run: python -m unittest discover -s tests -p test_security_route_holds.py -v
      - name: Inventory historical outbound paths and dependencies
        run: python -m tools.outbound_ci_inventory --ref b3b6cdfbed02866fce73fb0d207926e222a6c869 --output outbound-ci-inventory.json
      - name: Confirm unqualified release blocked
        run: |
          set +e
          python -m pipeline.limitations_audit --release-gate --output limitations-release-check.json > release.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep 'BLOCK_UNQUALIFIED_PUBLICATION: scope-specific independent review required' release.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: limitations-audit
          path: |
            outbound-ci-inventory.json
            security-triage.json
            requirements-matrix.json
            audit-b3-review.json
            audit-b2-review.json
            limitation-triage.json
            repository-inventory.json
            limitations-audit.json
            limitations-release-check.json
            release.log
          retention-days: 30
